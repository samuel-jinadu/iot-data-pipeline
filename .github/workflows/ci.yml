name: IoT Pipeline CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
        - { uses: actions/checkout@v4 }
        - { name: Set up Docker Buildx, uses: docker/setup-buildx-action@v3 }
        - { 
            name: Build test image,
            uses: docker/build-push-action@v6,
            with: { context: ".", target: test, load: true, tags: iot-pipeline:test, cache-from: "type=gha,scope=iot-test", cache-to: "type=gha,mode=max,scope=iot-test" }
            }
        - { name: Formatter, run: "docker run --rm iot-pipeline:test uv run black --check ." }
        - { name: Lint, run: "docker run --rm iot-pipeline:test uv run ruff check" }
        - { name: Tests, run: "docker run --rm iot-pipeline:test uv run pytest" }
        - { 
            name: Build prod image,
            uses: docker/build-push-action@v6,
            with: { context: ".", target: prod, push: false, tags: iot-pipeline:prod, cache-from: "type=gha,scope=iot-prod", cache-to: "type=gha,mode=max,scope=iot-prod" }
            }